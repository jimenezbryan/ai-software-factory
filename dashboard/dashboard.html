<script src="/v/icons.js"></script>
<script src="/v/motion.js"></script>
<script>
const $=i=>document.getElementById(i);
const M=window.Motion||null,calm=matchMedia('(prefers-reduced-motion: reduce)').matches,live=!!M&&!calm;
const SPRING={type:'spring',visualDuration:.42,bounce:.14},SOFT={type:'spring',visualDuration:.6,bounce:.06},OUT=[.16,1,.3,1];
const DEMO=new URLSearchParams(location.search).has('demo');
const TOKEN=document.querySelector('meta[name=dashboard]').content;
const fx=(e,k,o)=>live?M.animate(e,k,o):null;
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function icon(n){const s=el('span','ico');s.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+(window.ICONS[n]||'')+'</svg>';return s} // Constants from vendor/icons.js only.
document.querySelectorAll('[data-i]').forEach(s=>s.replaceWith(icon(s.dataset.i)));
// One status mark everywhere; its color says the state.
function visor(state,size){const s=el('span','mk '+state);s.style.width=s.style.height=size+'px';
 s.innerHTML=state==='done'?'<svg viewBox="0 0 24 24" aria-hidden="true"><path class="chk" d="M5 12.5L10 17.5L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><circle class="dot" cx="12" cy="12" r="7"/></svg>';return s}
// What the visor may claim. "Done and tested" requires a QA or Live check comment on the PR; a merge alone does not prove it. "Failed" requires a failing test on GitHub.
const stateOf=it=>it.needs?'wait':it.working?'work':it.failing?'fail':it.tested?'done':'idle';
const stateText=it=>({wait:'Waiting for you',work:'Working',fail:'A test failed',done:'Done and tested',idle:it.station==='ship'?'Merged, unconfirmed':'Paused'})[stateOf(it)];
$('brandIcon').innerHTML='<svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="#CBB26A"/></svg>';
const loops=new Set();
const VIEWS=[['Projects','layers'],['Agents','bot'],['Decisions','bell'],['Usage','chart']];
const STATIONS=[{id:'off',n:'Off the line',i:'folder',w:''},{id:'build',n:'Build',i:'hammer',w:'ag'},{id:'review',n:'Review',i:'eye',w:'ag'},{id:'qa',n:'QA',i:'flask',w:'ag'},{id:'g2',n:'Your merge',i:'merge',w:'you'},{id:'ship',n:'Deploy',i:'rocket',w:'you'},{id:'live',n:'Live',i:'radio',w:'ag'},{id:'record',n:'Record',i:'notes',w:'you'}];
const sta=id=>STATIONS.find(s=>s.id===id)||STATIONS[1];
const fmt=n=>{n=n||0;return n>=999.5e6?(n/1e9).toFixed(1)+' B':n>=999.5e3?(n/1e6).toFixed(1)+' M':n>=1e3?Math.round(n/1e3)+' K':String(n)};
function modelName(m){if(!m)return '';let r=/^claude-([a-z]+)-(\d+)(?:-(\d+))?/.exec(m);if(r)return r[1][0].toUpperCase()+r[1].slice(1)+' '+r[2]+(r[3]&&r[3].length<3?'.'+r[3]:'');r=/^gpt-([\d.]+)-?(\w*)/.exec(m);if(r)return 'GPT-'+r[1]+(r[2]?' '+r[2][0].toUpperCase()+r[2].slice(1):'');return m}
function family(m){m=m||'';return /opus/.test(m)?'Opus':/gpt|codex/.test(m)?'GPT':/sonnet/.test(m)?'Sonnet':/haiku|fable/.test(m)?'Haiku and Fable':'Other'}
const FAMS=[['Opus','--c1'],['GPT','--c2'],['Sonnet','--c3'],['Haiku and Fable','--c4'],['Other','--c5']];
let D=null,view='Projects',repo=null,q='',first=true,chartFresh=true;

/* ---- navigation ---- */
VIEWS.forEach(([n,i])=>{const b=el('button','nav');b.type='button';b.dataset.v=n;b.append(icon(i),el('span','',n));if(n==='Decisions')b.append(Object.assign(el('span','badge','0'),{id:'bDec',hidden:true}));b.onclick=()=>go(n);$('nav').append(b);
 const t=el('button','tab');t.type='button';t.dataset.v=n;t.append(icon(i),el('span','',n));t.onclick=()=>go(n);$('tabs').append(t)});
function movePill(){const a=$('nav').querySelector('[aria-current=page]');if(!a)return;const y=a.offsetTop;if(live)M.animate($('pill'),{y},SPRING);else $('pill').style.transform=`translateY(${y}px)`}
const hashView=()=>{try{return decodeURIComponent(location.hash.slice(1))}catch(e){return ''}};
function go(v,skip){if(!VIEWS.some(x=>x[0]===v))v='Projects';const changed=v!==view;view=v;$('title').textContent=v;
 VIEWS.forEach(([n])=>{$('v'+n).hidden=n!==v});
 document.querySelectorAll('[data-v]').forEach(b=>b.dataset.v===v?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
 movePill();if(!skip&&location.hash.slice(1)!==v)history.replaceState(null,'','#'+v);
 // No filter here: a filter on the parent turns off the glass of everything inside it.
 if(changed){chartFresh=true;fx($('v'+v),{opacity:[0,1],scale:[.985,1]},{duration:.3,ease:OUT});if(D)paint(D)}}
$('sYouBtn').onclick=()=>go(!D?view:D.decisions.length?'Decisions':D.projects.some(p=>p.items.some(i=>i.needs))?'Agents':'Projects');$('ctxBtn').onclick=()=>go('Agents');
$('q').oninput=e=>{q=e.target.value.toLowerCase();if(D)paint(D)};
STATIONS.forEach(s=>{const e=el('span','step '+s.w);e.append(icon(s.i),el('span','',s.n));$('stepper').append(e)});

/* ---- filters ---- */
const matches=it=>!q||[it.name,it.branch,modelName(it.model),it.agent].join(' ').toLowerCase().includes(q);
const visible=p=>!repo||p.repo===repo;

/* ---- context ring ---- */
function ring(pct){const r=el('span','ring'+(pct>=90?' hot':pct>=70?' warn':''));r.title=pct==null?'Context unknown':`Context ${pct}%`;
 const v=Math.min(100,pct||0);r.innerHTML=`<svg viewBox="0 0 30 30" aria-hidden="true"><circle class="t" cx="15" cy="15" r="12.5"/><circle class="v" cx="15" cy="15" r="12.5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100-v}"/></svg>`;r.append(el('span','',pct==null?'–':String(pct)));return r}

/* ---- projects: the card flies from one step to the next ---- */
const chips=new Map(),reels=new Map();
function chipMeta(it){const n=(it.sessions||[]).length;if(n>1&&!it.needs&&!it.failing)return `${n} agents`;if(it.failing&&!it.working&&!it.needs)return 'A test failed';const m=modelName(it.model);return it.needs?'Waiting for you':it.working?(m||it.agent||'Working'):[m||it.agent,it.pr?'PR #'+it.pr:''].filter(Boolean).join(' · ')||' '}
function fillChip(c,it){c._it=it;c.className='chip'+(it.needs?' needs':it.working?' working':it.failing?' failed':it.station==='g2'?' mine':'');c.querySelector('b').textContent=it.name;
 const meta=c.querySelector('.chipmeta');const st=stateOf(it),kind=st==='idle'&&!it.agent?'':st;if(meta._k!==kind){meta._k=kind;meta.querySelector('.lead')?.remove();if(kind){const s=visor(kind,16);s.classList.add('lead');meta.prepend(s)}}
 meta.querySelector('.txt').textContent=chipMeta(it);c.setAttribute('aria-label',`${it.name}. ${sta(it.station).n}. ${it.why}`)}
function makeChip(it){const c=el('button','chip');c.type='button';c.dataset.id=it.id;const m=el('span','chipmeta');m.append(el('span','txt'));c.append(el('b'),m);c.onclick=()=>openSheet(c._it,c);
 c.addEventListener('pointerdown',()=>fx(c,{scale:.97},{duration:.1}));c.addEventListener('pointerup',()=>fx(c,{scale:1},SPRING));c.addEventListener('pointerleave',()=>fx(c,{scale:1},SPRING));return c}
function makeReel(p){const r=el('article','card glass');const h=el('header');const nb=el('button','btn small');nb.type='button';nb.append(icon('sparkle'),el('span','','New job'));nb.onclick=()=>openLaunch(r._p,nb);h.append(el('h2','',p.repo),el('small'),nb);const t=el('div','track');r._cells={};
 STATIONS.forEach(s=>{const c=el('div','cell');const lab=el('small');lab.append(icon(s.i),el('span','',s.n));c.append(lab);r._cells[s.id]=c;t.append(c)});r.append(h,t);r._t=t;return r}
function paintReels(d){const box=$('reels');const shown=view==='Projects';const before=new Map();if(shown)chips.forEach((c,id)=>{if(c.isConnected)before.set(id,c.getBoundingClientRect())});
 const seen=new Set(),fresh=[];const ps=d.projects.filter(visible);box.querySelector('.empty')?.remove();
 ps.forEach((p,i)=>{let r=reels.get(p.repo);if(!r){r=makeReel(p);reels.set(p.repo,r)}if(box.children[i]!==r)box.insertBefore(r,box.children[i]||null);r._p=p;
  const note=[p.tickets?p.tickets+(p.tickets===1?' ticket ready':' tickets ready'):'',p.paused?p.paused+' paused':''].filter(Boolean).join(' · ');r.querySelector('header small').textContent=note;
  const items=p.items.filter(matches);r.hidden=!items.length&&!!q;r._t.hidden=!items.length;
  items.forEach(it=>{seen.add(it.id);let c=chips.get(it.id);if(!c){c=makeChip(it);chips.set(it.id,c);fresh.push(c)}fillChip(c,it);const cell=r._cells[it.station]||r._cells.build;if(c.parentNode!==cell)cell.append(c)});
  Object.values(r._cells).forEach(c=>c.classList.toggle('none',!c.querySelector('.chip')))});
 chips.forEach((c,id)=>{if(!seen.has(id)){chips.delete(id);const old=c.querySelector('.lead');if(old&&old._a){old._a.stop();loops.delete(old._a)}const a=fx(c,{opacity:0,scale:.92},{duration:.18});if(a)a.then(()=>c.remove());else c.remove()}});
 reels.forEach((r,k)=>{if(!ps.some(p=>p.repo===k))r.remove()});
 if(live&&shown)chips.forEach((c,id)=>{const a=before.get(id);if(!a||!c.isConnected)return;const b=c.getBoundingClientRect();const dx=a.left-b.left,dy=a.top-b.top;if(Math.abs(dx)<1&&Math.abs(dy)<1)return;M.animate(c,{x:[dx,0],y:[dy,0]},SOFT)});
 if(live&&shown)fresh.forEach((c,i)=>M.animate(c,{opacity:[0,1],scale:[.94,1]},{...SPRING,delay:Math.min(i*.03,.4)}));
 if(!ps.length)box.append(emptyBox('layers','Nothing here','No project has had activity in the last three days.'));else if(q&&!ps.some(p=>p.items.some(matches)))box.append(emptyBox('search','No results','No job matches that search.'))}
function emptyBox(i,t,x){const e=el('div','empty');e.append(icon(i),el('b','',t),el('span','',x));return e}

/* ---- agents ---- */
const sig=new Map();const same=(k,v)=>{const s=JSON.stringify(v);if(sig.get(k)===s)return true;sig.set(k,s);return false};
const rows=new Map();
function makeRow(){const r=el('button','row');r.type='button';r._st=el('span','state');r._b=el('b');r._s=el('small');const t=el('span');t.append(r._b,r._s);r._tag=el('span','tag');r._num=el('span','num');r._ring=ring(null);r.append(r._st,t,r._tag,r._num,r._ring);r.onclick=()=>openSheet(r._item,r,r._sid);return r}
function fillRow(r,it){r._item=it._item;r._sid=it.sid||null;const k=stateOf(it);if(r._k!==k){r._k=k;r._st.replaceChildren(visor(k,36))}
 r._b.textContent=it.name+(it.label?' · '+it.label:'');r._s.textContent=[it.repo,sta(it.station).n,it.working&&!it.needs?(it.tool||'').split('__').pop()||'Working':stateText(it)].filter(Boolean).join(' · ');
 r._tag.textContent=[modelName(it.model)||it.agent,it.effort].filter(Boolean).join(' · ');r._num.textContent=it.tokens!=null?fmt(it.tokens)+' tokens':'—';
 if(r._pct!==it.ctxPct){r._pct=it.ctxPct;const n=ring(it.ctxPct);r._ring.replaceWith(n);r._ring=n}}
function paintAgents(d){const items=d.projects.filter(visible).flatMap(p=>p.items.flatMap(i=>{const base={...i,repo:p.repo,_item:i,rowKey:i.id};const ss=i.sessions||[];if(ss.length<2)return[base];return ss.map(s=>({...base,...s,label:s.label||s.sid,rowKey:i.id+'/'+s.sid,tool:'',working:s.status==='busy'||s.status==='shell',needs:s.status==='waiting'}))})).filter(i=>i.agent&&matches(i)).sort((a,b)=>(b.needs-a.needs)||(b.working-a.working)||((b.ctxPct||0)-(a.ctxPct||0)));
 if(same('agents',items))return;const box=$('agents');box.querySelector('.empty')?.remove();const seen=new Set();
 items.forEach((it,i)=>{seen.add(it.rowKey);let r=rows.get(it.rowKey);if(!r){r=makeRow();rows.set(it.rowKey,r)}fillRow(r,it);if(box.children[i]!==r)box.insertBefore(r,box.children[i]||null)});
 rows.forEach((r,id)=>{if(!seen.has(id)){r.remove();rows.delete(id)}});
 if(!items.length)box.append(emptyBox('bot','No agents','When an agent runs in Orca, it shows up here with its model and tokens.'))}

/* ---- decisions ---- */
function paintDecisions(d){const box=$('decs');const ids=new Set(d.decisions.map(x=>String(x.id)));
 [...box.querySelectorAll('.dec')].forEach(n=>{if(!ids.has(n.dataset.id)){const a=fx(n,{opacity:0,scale:.97},{duration:.18});if(a)a.then(()=>n.remove());else n.remove()}});
 box.querySelector('.empty')?.remove();if(!d.decisions.length){box.append(emptyBox('check','Nothing is waiting for you','The agents keep working without you.'));return}
 d.decisions.forEach(x=>{const id=String(x.id);if(box.querySelector(`[data-id="${CSS.escape(id)}"]`))return;const c=el('article','dec glass');c.dataset.id=id;
  const ta=el('textarea');ta.placeholder='Your answer';ta.setAttribute('aria-label','Your answer');const b=el('button','btn main');b.type='button';b.append(icon('send'),el('span','','Answer'));
  b.onclick=async()=>{b.disabled=true;if(await act('/api/answer',{id,text:ta.value}))ta.value='';b.disabled=false};
  const cp=el('button','btn','Copy command');cp.type='button';cp.onclick=()=>navigator.clipboard.writeText(x.reply).then(()=>hud('check','Copied'),()=>hud('alert','Could not copy'));
  const row=el('div','btns');row.append(b,cp);c.append(el('small','',x.kind+(x.task?' · '+x.task:'')),el('p','',x.text),ta,row);box.append(c);fx(c,{opacity:[0,1],y:[12,0],scale:[.98,1]},SPRING)})}

/* ---- usage ---- */
function paintUsage(d){const tip=$('tip');if(tip&&!tip.hidden)return;const u=d.usage||{days:[],models:[],projects:[],today:[0,0],week:[0,0]};if(view!=='Usage'){sig.delete('usage');return}if(same('usage',u))return;const v=$('vUsage');v.replaceChildren();
 if(!u.ready){const p=el('div','panel glass');const i=el('i');const bar=el('div','bar');bar.append(i);p.append(el('h3','','Reading the session logs'),bar,el('p','',`${u.pct||0}%. The first time takes longer because it scans a week of logs.`));v.append(p);i.style.transform=`scaleX(${(u.pct||0)/100})`;return}
 const tiles=el('div','tiles');[['Today',u.today],['Last 7 days',u.week]].forEach(([t,val])=>{const c=el('div','tile glass');c.append(el('h3','',t),el('strong','',fmt(val[0])),el('small','','new tokens · '+fmt(val[1])+' cache read'));tiles.append(c)});v.append(tiles);
 const p=el('div','panel glass');p.append(el('h3','','New tokens per day'));const leg=el('div','legend');FAMS.forEach(([n,c])=>{if(u.models.some(m=>family(m.model)===n)){const s=el('span');const i=el('i');i.style.background=`var(${c})`;s.append(i,n);leg.append(s)}});p.append(leg);const ch=el('div');ch.id='chart';p.append(ch);v.append(p);drawChart(ch,u);chartFresh=false;
 const table=(title,note,heads,rows)=>{const n=el('div','panel glass');n.append(el('h3','',title));if(note)n.append(el('p','',note));const w=el('div','tablewrap');const t=el('table');const hd=el('tr');heads.forEach(x=>hd.append(el('th','',x)));const th=el('thead');th.append(hd);const tb=el('tbody');rows.forEach(rw=>{const r=el('tr');rw.forEach(x=>r.append(el('td','',x)));tb.append(r)});t.append(th,tb);w.append(t);n.append(w);v.append(n)};
 table('By model','New tokens are input, cache writes and output. Cache read is listed apart because it reuses the same content many times.',['Model','Today','7 days','Cache read'],u.models.map(m=>[modelName(m.model),fmt(m.today),fmt(m.fresh),fmt(m.cached)]));
 if(u.projects.length)table('By project, last 7 days','',['Project','New tokens'],u.projects.map(m=>[m.name,fmt(m.fresh)]));
 const n=el('p','why','Gemini is not included: its CLI does not leave these logs here. These are tokens, not money.');n.style.fontSize='12.5px';v.append(n)}
function drawChart(host,u){const W=Math.max(300,host.clientWidth||720),H=240,L=46,B=26,T=8;const days=u.days.map(x=>{const f={};Object.entries(x.models).forEach(([m,v])=>{const k=family(m);f[k]=(f[k]||0)+v[0]});return{day:x.day,f,total:Object.values(f).reduce((a,b)=>a+b,0)}});
 const max=Math.max(1,...days.map(d=>d.total));const nice=(()=>{const e=10**Math.floor(Math.log10(max));for(const k of[1,2,5,10])if(k*e>=max)return k*e;return 10*e})();const y=v=>(H-B)-(v/nice)*(H-B-T);
 const NS='http://www.w3.org/2000/svg';const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox',`0 0 ${W} ${H}`);s.setAttribute('role','img');s.setAttribute('aria-label','New tokens per day over the last 7 days, by model family. Per-model values are in the table below.');
 const add=(n,a,t)=>{const e=document.createElementNS(NS,n);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(t!=null)e.textContent=t;s.append(e);return e};
 [0,.5,1].forEach(k=>{const v=nice*k;add('line',{class:'grid',x1:L,x2:W,y1:y(v),y2:y(v)});add('text',{x:L-8,y:y(v)+4,'text-anchor':'end'},fmt(v))});
 const slot=(W-L)/days.length,bw=Math.min(44,slot*.5);const tip=el('div');tip.id='tip';tip.hidden=true;
 days.forEach((d,i)=>{const x=L+slot*i+(slot-bw)/2;const g=document.createElementNS(NS,'g');s.append(g);let base=0;const parts=FAMS.filter(([n])=>d.f[n]);parts.forEach(([n,c],j)=>{const v=d.f[n];const y1=y(base+v),y0=y(base);const h=Math.max(1,y0-y1-(j?2:0));const top=j===parts.length-1;
    const r=document.createElementNS(NS,'path');const w=bw,rr=top?Math.min(4,h):0;r.setAttribute('d',`M${x} ${y1+h}V${y1+rr}${rr?`Q${x} ${y1} ${x+rr} ${y1}`:''}H${x+w-rr}${rr?`Q${x+w} ${y1} ${x+w} ${y1+rr}`:''}V${y1+h}Z`);r.setAttribute('fill',`var(${c})`);g.append(r);base+=v});
  if(live&&chartFresh){g.style.transformOrigin=`${x+bw/2}px ${H-B}px`;M.animate(g,{scaleY:[0,1],opacity:[0,1]},{...SOFT,delay:i*.045})}
  const dt=new Date(d.day+'T12:00:00');add('text',{x:x+bw/2,y:H-8,'text-anchor':'middle'},dt.toLocaleDateString('en',{weekday:'short',day:'numeric'}));
  const hit=add('rect',{x:L+slot*i,y:0,width:slot,height:H-B,fill:'transparent',tabindex:0});const show=()=>{tip.replaceChildren(el('b','',dt.toLocaleDateString('en',{weekday:'long',day:'numeric',month:'long'})));FAMS.forEach(([n])=>{if(d.f[n]){const r=el('div');r.append(el('span','',n),el('span','',fmt(d.f[n])));tip.append(r)}});const r=el('div');r.append(el('span','','Total'),el('span','',fmt(d.total)));tip.append(r);tip.hidden=false;const pct=(i+.5)/days.length;tip.style.left=`calc(${pct*100}% - ${pct*170}px)`;tip.style.top='0'};hit.addEventListener('pointerenter',show);hit.addEventListener('focus',show);hit.addEventListener('pointerleave',()=>tip.hidden=true);hit.addEventListener('blur',()=>tip.hidden=true)});
 host.append(s,tip)}

/* ---- sheet: the panel that opens from what you tapped ---- */
let cur=null,curAgent=null;const drafts=new Map();
const selected=it=>{const ss=it.sessions||[];return ss.find(s=>s.sid===curAgent)||ss[0]||null};
function kv(k,v){const r=el('div','kv');r.append(el('span','',k),el('span','',v));return r}
function drawInfo(it){$('sTitle').textContent=it.name;$('sWhy').textContent=it.why;const rows=[];
 rows.push(kv('State',stateText(it)));rows.push(kv('Step',sta(it.station).n));if(it.proof)rows.push(kv('Tests',it.proof));
 const many=(it.sessions||[]).length>1;
 if(many)rows.push(kv('Tokens of all',`${fmt(it.sessions.reduce((a,s)=>a+s.tokens,0))} new · ${fmt(it.sessions.reduce((a,s)=>a+s.cached,0))} cache read`));
 else if(it.model)rows.push(kv('Model',[modelName(it.model),it.effort&&'effort '+it.effort].filter(Boolean).join(' · ')));else if(it.agent)rows.push(kv('Agent',it.agent));
 if(!many&&it.ctxPct!=null)rows.push(kv('Context',`${fmt(it.ctx)} of ${fmt(it.ctxMax)} (${it.ctxPct}%)`+(it.ctxPct>=90?'. Compacting soon':it.ctxPct>=70?'. Filling up':'')));
 if(!many&&it.tokens!=null)rows.push(kv('Tokens of this session',`${fmt(it.tokens)} new · ${fmt(it.cached)} cache read`));
 if(it.branch)rows.push(kv('Branch',it.branch));if(it.tasks&&it.tasks.length)rows.push(kv('Task',it.tasks.join(', ')));
 if(it.since)rows.push(kv('In this state since',new Date(it.since).toLocaleString()));
 $('sRows').replaceChildren(...rows);
 const subs=many?it.sessions.flatMap(s=>s.subs||[]):it.subs||[];$('sSubs').replaceChildren();
 if(many){const focus=document.activeElement&&document.activeElement.dataset.sid,on=selected(it);const r=el('div','rows');[...it.sessions].sort((a,b)=>a.sid<b.sid?-1:1).forEach(x=>{const b=el('button','kv pick'+(x===on?' on':''));b.type='button';b.dataset.sid=x.sid;b.setAttribute('aria-pressed',x===on);b.append(el('span','',[x.status==='waiting'?'Waiting for you':x.status==='busy'||x.status==='shell'?'Working':x.status==='idle'?'Idle':'',modelName(x.model),x.effort,x.label||x.sid].filter(Boolean).join(' · ')),el('span','',`${fmt(x.tokens)} tokens`+(x.ctxPct!=null?` · context ${x.ctxPct}%`:'')));const choose=()=>{if(curAgent===x.sid)return;curAgent=x.sid;drawInfo(cur);drawActions(cur)};b.onpointerdown=choose;b.onclick=choose;r.append(b)});$('sSubs').append(el('b','',`Agents on this job (${it.sessions.length}). Tap one to write to it`),r);if(focus){const n=r.querySelector(`[data-sid="${CSS.escape(focus)}"]`);if(n)n.focus()}}
