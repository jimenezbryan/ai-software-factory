name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: guard self-test
        run: python3 guard.py --check
      - name: dashboard self-test
        run: python3 dashboard/dashboard.py --check
